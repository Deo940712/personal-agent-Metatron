[project]
name = "my-agent"
version = "0.1.0"
description = "Personal schedule + knowledge-base assistant (stateless core, two-DB memory)"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "sqlite-vec>=0.1.9"]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]     # part-002.5:出門用 Discord bot

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
